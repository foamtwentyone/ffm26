<script>
  // Телефон вертикально → игра повёрнута на 90° (всегда горизонтальный вид). Подсказка «Поверните телефон» — один раз при входе.
  (function () {
    var mq = matchMedia('(orientation: portrait) and (pointer: coarse) and (max-width: 900px)'), h = document.documentElement, first = true;
    if (matchMedia('(pointer: coarse)').matches) h.classList.add('tch'); // сенсорный экран: прокрутка внутри игры, без «резинки»
    // размеры повёрнутого «экрана» в пикселях: ширина = видимая высота телефона, высота = его ширина (с учётом масштаба 0.86)
    function size() { if (!h.classList.contains('rot')) return; var v = window.visualViewport, W = v ? v.height : innerHeight, H = v ? v.width : innerWidth; h.style.setProperty('--rw', (W / 0.86) + 'px'); h.style.setProperty('--rh', (H / 0.86) + 'px'); }
    function upd() { h.classList.toggle('rot', mq.matches); if (mq.matches && first) h.classList.add('rot-hint'); if (!mq.matches) h.classList.remove('rot-hint'); first = false; size(); }
    upd(); (mq.addEventListener ? mq.addEventListener('change', upd) : mq.addListener(upd));
    addEventListener('resize', size); if (window.visualViewport) visualViewport.addEventListener('resize', size);
  })();
</script>

  <script>
    // офлайн-режим и установка на телефон (только на настоящем сайте, не при открытии файла)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      // новая версия: проверяем при каждом возвращении в приложение; когда она установилась — предлагаем перезапуск
      navigator.serviceWorker.register('sw.js').then((reg) => document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); }));
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had) { had = true; return; } if (window.FM_UPDATE) window.FM_UPDATE(); });
    }
